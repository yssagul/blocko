[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "blocko"
version = "0.1.0"
description = "Monte Carlo simulation framework for the 4x4x4 block stacking strategy game"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
server = ["flask>=3.0"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["blocko*"]
